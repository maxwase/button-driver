[package]
edition = "2021"
name = "stm32f1-embassy"
version = "0.1.0"

[dependencies]
embassy-stm32 = { version = "0.6.0", features = [ "defmt", "stm32f103c8", "unstable-pac", "memory-x", "time-driver-any" ]  }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }

defmt = "1.2.0"
defmt-rtt = "1.3.1"

cortex-m = { version = "0.7.10", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.7"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
button-driver = { path = "../../", features = ["embassy", "embedded_hal_old"] }

[profile.dev]
opt-level = "s"

[profile.release]
debug = 2
