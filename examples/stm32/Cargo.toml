[package]
name = "stm32"
version = "0.1.0"
edition = "2021"


[dependencies]
cortex-m = { version = "0.7.10", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
button-driver = { path = "../../", features = ["embedded_hal_old"]}
rtt-target = "0.6.2"
panic-halt = "1.0.0"

[dependencies.stm32f1xx-hal]
version = "0.11.0"
features = ["stm32f103", "medium"]
